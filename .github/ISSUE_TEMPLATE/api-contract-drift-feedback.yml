name: "API Contract Drift: first-result feedback"
description: "Report whether the 30-second offline demo worked or where you got stuck. Failures welcome."
title: "[API Contract Drift first run] "
body:
  - type: markdown
    attributes:
      value: |
        This form is for **independent first-run feedback**, not a request for stars.
        You can run the [synthetic OpenAPI demo](https://github.com/BarganConstantin/agent-skills#see-a-result-in-30-seconds)
        using Python 3.10+ without an AI agent or API credentials.

        The fixture has three deliberately planted potential client breaks.
        Matching its expected output **does not** prove correctness on a real API.

        **Do not paste real API specs, tokens, private endpoints, customer data,
        screenshots containing secrets, or identifying information.**
        A failure to run the command is useful feedback too.
  - type: dropdown
    id: outcome
    attributes:
      label: First result
      description: What happened when you tried the documented demo?
      options:
        - "Ran demo; saw three potential client breaks"
        - "Ran demo; output differed from the README"
        - "Could not run the documented command"
        - "Ran demo; result was unclear"
        - "Not run; found a documentation blocker"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you try, and what happened?
      description: Summarize commands and sanitized error text only; no real API files or credentials.
      placeholder: "Example: Python 3.12 on Windows; ran the README command; received ModuleNotFoundError ... (redacted)."
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: One improvement you would prioritize (optional)
      description: What would make the first useful result easier or more trustworthy?
      placeholder: "Example: include a PowerShell command, or explain one reported change."
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to share publicly
      options:
        - label: "I checked that this report contains no credentials, private endpoints, customer data, confidential schemas or personal information."
          required: true
