name: Evaluation fixture browser smoke

on:
  push:
    branches: [main]
    paths:
      - "evals/fixtures/**"
      - ".github/workflows/eval-fixture-browser.yml"
  pull_request:
    paths:
      - "evals/fixtures/**"
      - ".github/workflows/eval-fixture-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only browser dependencies
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Verify seeded and reference fixture behavior
        run: python -m unittest discover -s evals/fixtures -p 'test_browser.py' -v
