name: Validate skills
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reporter unit tests
        run: python -m unittest discover -s skills/first-user-audit/tests -v
      - name: Validate reviewed example and evidence paths
        run: |
          python skills/first-user-audit/scripts/summarize.py --root examples/first-user-demo/reports --strict --verify-evidence --output "$RUNNER_TEMP/example-report.md"
          cmp examples/first-user-demo/report.md "$RUNNER_TEMP/example-report.md"

  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both fixture variants through Playwright MCP
        shell: bash
        run: |
          python examples/first-user-demo/server.py --variant baseline > "$RUNNER_TEMP/demo.log" 2>&1 &
          DEMO_PID=$!
          npx -y @playwright/mcp@0.0.83 --isolated --headless --browser chrome --port 8931 --host 127.0.0.1 --allowed-origins http://127.0.0.1:4179 --image-responses omit --no-webmcp > "$RUNNER_TEMP/mcp.log" 2>&1 &
          MCP_PID=$!
          trap 'kill "$DEMO_PID" "$MCP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -s http://localhost:8931/mcp > /dev/null; then break; fi
            sleep 1
          done
          python examples/first-user-demo/browser_check.py --variant baseline
          kill "$DEMO_PID"
          wait "$DEMO_PID" || true
          python examples/first-user-demo/server.py --variant fixed >> "$RUNNER_TEMP/demo.log" 2>&1 &
          DEMO_PID=$!
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4179/config.js | grep -q fixed; then break; fi
            sleep 1
          done
          python examples/first-user-demo/browser_check.py --variant fixed
