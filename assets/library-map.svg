<rect x="36" y="123" width="232" height="118" rx="11"/><rect x="280" y="123" width="232" height="118" rx="11"/><rect x="524" y="123" width="232" height="118" rx="11"/><rect x="768" y="123" width="232" height="118" rx="11"/><rect x="1012" y="123" width="232" height="118" rx="11"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="56" y="157" font-size="13" font-weight="700" fill="#d8fa92">01 / DESIGN</text><text x="56" y="194" font-size="24" font-weight="700" fill="#f6faf5">UI / UX</text><text x="56" y="222" font-size="13" fill="#9fb7ac">Interfaces · Motion</text>
<text x="300" y="157" font-size="13" font-weight="700" fill="#d8fa92">02 / ENGINEERING</text><text x="300" y="194" font-size="24" font-weight="700" fill="#f6faf5">Backend</text><text x="300" y="222" font-size="13" fill="#9fb7ac">API · .NET · Services</text>
<text x="544" y="157" font-size="13" font-weight="700" fill="#d8fa92">03 / QUALITY</text><text x="544" y="194" font-size="24" font-weight="700" fill="#f6faf5">Code Review</text><text x="544" y="222" font-size="13" fill="#9fb7ac">Contracts · Decisions</text>
<text x="788" y="157" font-size="13" font-weight="700" fill="#d8fa92">04 / VERIFICATION</text><text x="788" y="194" font-size="24" font-weight="700" fill="#f6faf5">Testing / QA</text><text x="788" y="222" font-size="13" fill="#9fb7ac">Browser · Automation</text>
<text x="1032" y="157" font-size="13" font-weight="700" fill="#d8fa92">05 / AGENTS</text><text x="1032" y="194" font-size="22" font-weight="700" fill="#f6faf5">Workflows</text><text x="1032" y="222" font-size="13" fill="#9fb7ac">Plan · Build · Verify</text>
