<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 296" role="img" aria-labelledby="title desc">
<title id="title">Reference Library — five areas to explore</title>
<desc id="desc">Five organized reference categories: UI and UX, Backend and API, Code Review, Testing and QA, Agent Workflows. A small indicator travels across the top and stops.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c161a"/><stop offset="1" stop-color="#1b292b"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#233333"/><stop offset="1" stop-color="#142024"/></linearGradient></defs>
<rect width="1280" height="296" rx="18" fill="url(#bg)"/>
<path d="M35 30h1210M35 266h1210" fill="none" stroke="#466254" stroke-opacity=".55"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="38" y="62" fill="#d8fa92" font-size="13" font-weight="700" letter-spacing="2.4">THE KNOWLEDGE SHELF</text>
<text x="38" y="93" fill="#eef5ee" font-size="27" font-weight="700" letter-spacing="-.6">Find the right reference. Skip the guesswork.</text>
<text x="1238" y="60" text-anchor="end" fill="#9eb6a7" font-size="12" font-family="Courier New, Courier, monospace">FIVE AREAS / NINE SOURCES</text>
</g>
